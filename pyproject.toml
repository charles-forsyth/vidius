[project]
name = "vidius"
version = "0.1.0"
description = "A professional CLI for generating videos using Vertex AI VEO models."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai",
    "pydantic>=2.0",
    "pydantic-settings",
    "pandas",
    "python-dotenv",
]

[project.scripts]
vidius = "vidius.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidius"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.mypy]
strict = true
ignore_missing_imports = true